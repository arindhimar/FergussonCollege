<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator and Text Length</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" 
          integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" 
          crossorigin="anonymous">
    
    <script src="https://code.jquery.com/jquery-3.7.1.js" integrity="sha256-eKhayi8LEQwp4NKxN+CfCh+3qOVUtJn3QNZ0TciWLP4=" crossorigin="anonymous"></script>
    
    <script>
        $(document).ready(function () {
            $('#calculateLength').click(function () {
                var inputText = $('#textArea').val();
                var length = inputText.length;
                $('#lengthOutput').text('Length of text: ' + length);
            });

            $('#add').click(function () {
                var num1 = parseFloat($('#num1').val());
                var num2 = parseFloat($('#num2').val());
                var sum = num1 + num2;
                $('#resultOutput').text('Result: ' + sum);
            });

            $('#subtract').click(function () {
                var num1 = parseFloat($('#num1').val());
                var num2 = parseFloat($('#num2').val());
                var difference = num1 - num2;
                $('#resultOutput').text('Result: ' + difference);
            });

            $('#multiply').click(function () {
                var num1 = parseFloat($('#num1').val());
                var num2 = parseFloat($('#num2').val());
                var product = num1 * num2;
                $('#resultOutput').text('Result: ' + product);
            });

            $('#divide').click(function () {
                var num1 = parseFloat($('#num1').val());
                var num2 = parseFloat($('#num2').val());
                if (num2 !== 0) {
                    var quotient = num1 / num2;
                    $('#resultOutput').text('Result: ' + quotient);
                } else {
                    $('#resultOutput').text('Error: Division by zero');
                }
            });
        });
    </script>
</head>

<body>
    <div class="container mt-5">
        <h2>Text Length and Simple Calculator</h2>
        
        <div class="mb-3">
            <label for="textArea" class="form-label">Enter text:</label>
            <textarea class="form-control" id="textArea" rows="3" placeholder="Type your text here"></textarea>
        </div>
        <button id="calculateLength" class="btn btn-primary">Calculate Length</button>
        <div id="lengthOutput" class="mt-3"></div>

        <hr>

        <h4>Simple Calculator</h4>
        <div class="mb-3">
            <label for="num1" class="form-label">Number 1:</label>
            <input type="number" class="form-control" id="num1" placeholder="Enter first number">
        </div>
        <div class="mb-3">
            <label for="num2" class="form-label">Number 2:</label>
            <input type="number" class="form-control" id="num2" placeholder="Enter second number">
        </div>
        
        <button id="add" class="btn btn-success">Add</button>
        <button id="subtract" class="btn btn-danger">Subtract</button>
        <button id="multiply" class="btn btn-warning">Multiply</button>
        <button id="divide" class="btn btn-info">Divide</button>
        
        <div id="resultOutput" class="mt-3"></div>
    </div>
</body>

</html>
