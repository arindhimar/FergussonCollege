{% if edit_todo is defined %}

<form method="POST" action="/edit/{{edit_todo[0]}}">

    Title : <input type="text" name="title" value="{{edit_todo[1]}}"><br>
    Desc :<input type="text" name="desc" value="{{edit_todo[2]}}"><br>
    <input type="submit" value="Edit">

</form>

{% else %}

<form method="POST" action="add">

    Title : <input type="text" name="title" ><br>
    Desc :<input type="text" name="desc" ><br>
    <input type="submit" value="Add">

</form>



{% for todo in todos %}

<ul>
    <li>Title : {{todo[1]}} - Desc : {{todo[2]}} | <a href="/delete/{{todo[0]}}">delete</a> <a href="/edit/{{todo[0]}}">Edit</a>
    </li>
</ul>

{% endfor %}





{% endif %}
