<h2>Todo Task</h2>

<form action="/add" method="POST">
    <input type="text" name="task" placeholder="Add a new task">
    <input type="text" name="desc" placeholder="Add a new description">
    <button type="submit">Add Task</button>
</form>

<h2>Todo List</h2>

<ul>
    {% for task in tasks %}
        <li>{{ task[1] }} - {{ task[2] }}</li>
        <a href="/delete/{{ task[0] }}">Delete</a>
        <a href="/update/{{ task[0] }}">Update</a>
    {% endfor %}
</ul>
