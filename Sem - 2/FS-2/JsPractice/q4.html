<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let numbers= [10, 20, 10, 40, 50, 60,70]
        let target = 50;

        function method1(){
            for(let i=0; i<numbers.length; i++){
                let remaining = target - numbers[i];
                // console.log(numbers.indexOf(remaining))

                if(numbers.indexOf(remaining) != -1){
                    console.log([i, numbers.indexOf(remaining)]);
                    break;
                }
            }
        }

        method1();

        function method3(){
            for(let i=0; i<numbers.length; i++){
                let remaining = target - numbers[i];
                if(numbers.includes(remaining)){
                    console.log([i, numbers.indexOf(remaining)]);
                    break;
                }
            }
        }

        method3();


    </script>
</body>
</html>
