<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SQL Syntax Checker</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>SQL Syntax Checker</h1>
        <div class="input-area">
            <textarea id="sqlInput" placeholder="Enter your SQL query here..."></textarea>
            <button id="checkButton">Check Syntax</button>
        </div>
        <div id="result" class="result"></div>
        <div class="history">
            <h2>Query History</h2>
            <ul id="historyList"></ul>
        </div>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/brython/3.9.0/brython.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/brython/3.9.0/brython_stdlib.js"></script>
    <script src="script.js"></script>
    <script type="text/python" src="sql_parser.py"></script>
</body>
</html>
